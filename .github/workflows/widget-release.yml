name: Widget release

# Builds the DevBrain menu-bar widget (Tauri, macOS) and publishes it as a
# GitHub Release named widget-v<version>, where <version> comes from
# widget/src-tauri/tauri.conf.json. `devbrain update` on every teammate's Mac
# compares that version against /Applications/DevBrain.app and swaps in the
# new build.
#
# To ship a widget change: edit widget/**, bump "version" in tauri.conf.json,
# push to main. If the version was NOT bumped the build runs (as a check) but
# no release is created, so an existing release is never overwritten.
#
# The .app is unsigned (no Apple Developer ID yet). The updater strips the
# quarantine flag after download, so Gatekeeper's "unidentified developer"
# dialog does not appear. Adding signing/notarization later only touches this
# file. See docs/PRIVATE-REPO.md for what changes when the repo goes private.

on:
  push:
    branches: [main]
    paths:
      - "widget/**"
      - ".github/workflows/widget-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri

      - name: Read version
        id: ver
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=widget-v$v" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.ver.outputs.tag }} already exists — building as a check only. Bump the version in widget/src-tauri/tauri.conf.json to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Bundle Node runtime (no prerequisites for teammates)
        run: ./scripts/fetch-node.sh

      - name: Build .app
        run: npm run tauri build -- --bundles app

      - name: Ad-hoc sign with the bundle identifier
        # Tauri leaves the binary linker-signed with a random identifier. A
        # proper ad-hoc signature keyed to the bundle id keeps Notification
        # Center / TCC records stable across updates. No Developer ID needed.
        run: |
          codesign --force --deep -s - --identifier com.veriflush.devbrain-widget \
            src-tauri/target/release/bundle/macos/DevBrain.app
          codesign -dv src-tauri/target/release/bundle/macos/DevBrain.app 2>&1 | grep -E "Identifier|flags"

      - name: Free runner disk before packaging
        # The Rust intermediates run to several GB; with Node bundled the
        # runner hit "No space left on device" while hdiutil built the DMG.
        # The .app is complete at this point, so drop the intermediates.
        run: |
          df -h / | tail -1
          rm -rf src-tauri/target/release/deps src-tauri/target/release/build \
                 src-tauri/target/release/incremental src-tauri/target/release/.fingerprint \
                 ~/.cargo/registry/src ~/.cargo/git
          df -h / | tail -1

      - name: Zip + DMG
        # The zip feeds `devbrain update`; the DMG is the thing you send a new
        # teammate (drag to Applications, open, sign in, click "Set up").
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent DevBrain.app DevBrain.app.zip
          shasum -a 256 DevBrain.app.zip > DevBrain.app.zip.sha256
          cat DevBrain.app.zip.sha256
          rm -rf dmg && mkdir dmg && cp -R DevBrain.app dmg/ && ln -s /Applications dmg/Applications
          # Explicit size + HFS+: hdiutil's auto-sizing undershoots with the
          # 110 MB Node binary inside and fails with a misleading "No space
          # left on device" (the runner disk is fine).
          hdiutil create -size 600m -fs HFS+ -volname "DevBrain" -srcfolder dmg -ov -format UDZO DevBrain.dmg
          ls -la DevBrain.dmg

      - name: Publish release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DevBrain widget ${{ steps.ver.outputs.version }}" \
            --notes "Built from ${GITHUB_SHA::7}. New teammate: download DevBrain.dmg, drag to Applications, open, sign in, click Set up. Existing Macs update automatically." \
            src-tauri/target/release/bundle/macos/DevBrain.app.zip \
            src-tauri/target/release/bundle/macos/DevBrain.app.zip.sha256 \
            src-tauri/target/release/bundle/macos/DevBrain.dmg
